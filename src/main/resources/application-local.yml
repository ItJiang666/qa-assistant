# =============================================================================
# 模型 profile：local（默认，本地 Ollama）
# =============================================================================
# 与数据源 profile 正交：可以 h2,local，也可以 mysql,local。
# =============================================================================

qa:
  mode: local
  local:
    base-url: http://localhost:11434

    # 对话模型。
    # ⚠️ 不要换成 deepseek-r1:8b —— 那是推理模型，每次回答前会先"思考" 20~40 秒。
    chat-model: qwen3.5:9b

    # 向量模型。维度是 2560（实测），不是网上常说的 768（那是 nomic-embed-text）。
    # 换模型必须全量重建索引，否则向量空间不一致，检索会全错。
    embedding-model: qwen3-embedding:4b

    # 上下文窗口：auto | 4096 | 8192 | 16384
    #   auto = 启动时探测显存后选安全值（开发文档 12.6）：
    #          ≥11GB → 16384（本机 RTX 5070 档） / ≥7GB → 8192 / 无独显 → 4096
    #   ⚠️ 必须显式设置：Ollama 默认 num_ctx 往往只有 4096，
    #      不改这里，Java 侧算得再精确的 token 预算也会被截断。
    num-ctx: auto

    # 是否让模型先输出思维链再作答。
    # ⚠️ 本机实测（RTX 5070 / qwen3.5:9b）：think=true 时一句"你好"要 6860 ms（生成 777 字思维链），
    #    think=false 只要 415 ms —— 差 16.5 倍。本项目是"查资料给结论"，不是数学证明，故默认关闭。
    #    另注：提示词层面的 /no_think 软开关实测无效，必须走这个 API 参数。
    think: false

    # 单次回答的最大 token 数（对应 Ollama num_predict）。0 = 不限制。
    # 本地实测生成约 60 token/s：不设上限时模型偶尔长篇大论，单次请求轻松超过 10 秒；
    # 1024 token ≈ 700 汉字，与开发文档 4.6.6 的"回答预算 ≈1000 token"一致。
    # 注意它与系统提示词第 8 条（默认 200 字以内）是两道不同的闸：
    #   提示词管"该说多少"，这里管"最多能说多少"，后者是防止跑飞的硬兜底。
    max-output-tokens: 1024

    timeout: 120s

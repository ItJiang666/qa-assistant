# =============================================================================
# 本地模型参数（Ollama）
# =============================================================================
# ⚠️ P4 起这个 profile **不再决定模型来源**，只提供 qa.local.* 的默认值。
#    原因：模型来源已经可以在界面上运行时切换，两个供应商总是同时注册；
#    若这里继续写 qa.mode，会与"运行时切换 + QA_MODE 环境变量"打架 ——
#    profile 专属文件的优先级高于 application.yml 及其 .env 导入，
#    于是 .env 里写的 QA_MODE 永远不会生效（这个坑已实际踩到）。
#    模型来源的唯一出处：qa.mode（见 application.yml）→ 环境变量 QA_MODE → 界面开关。
# =============================================================================

qa:
  local:
    base-url: http://localhost:11434

    # 对话模型。
    # ⚠️ 不要换成 deepseek-r1:8b —— 那是推理模型，每次回答前会先"思考" 20~40 秒。
    chat-model: qwen3.5:9b

    # 向量模型：qa-embed:4b 是 deploy/ollama/Modelfile.qa-embed 派生出来的本地模型
    #   （FROM qwen3-embedding:4b + PARAMETER num_ctx 2048），先执行一次：
    #     ollama create qa-embed:4b -f deploy/ollama/Modelfile.qa-embed
    #   ⚠️ 不要退回裸的 qwen3-embedding:4b：它自带 40960 上下文，Ollama 会照此分配
    #      约 10GB 显存，在 12GB 显卡上必然把对话模型挤出去，导致【每次提问】都要
    #      重新加载两个模型（实测 2.9s + 4.8s，单次问答 7.7s → 0.7s 的差距）。
    #   向量维度 2560（与 qwen3-embedding:4b 完全一致，共用同一份权重），
    #   所以切换到它【不需要】重建索引；换成别的模型才必须全量重建。
    embedding-model: qa-embed:4b

    # 上下文窗口：auto | 4096 | 8192 | 16384
    #   auto = 启动时探测显存后选安全值（开发文档 12.6）：
    #          ≥11GB → 16384（本机 RTX 5070 档） / ≥7GB → 8192 / 无独显 → 4096
    #   ⚠️ 必须显式设置：Ollama 默认 num_ctx 往往只有 4096，
    #      不改这里，Java 侧算得再精确的 token 预算也会被截断。
    num-ctx: auto

    # 是否让模型先输出思维链再作答。
    # ⚠️ 本机实测（RTX 5070 / qwen3.5:9b）：think=true 时一句"你好"要 6860 ms（生成 777 字思维链），
    #    think=false 只要 415 ms —— 差 16.5 倍。本项目是"查资料给结论"，不是数学证明，故默认关闭。
    #    另注：提示词层面的 /no_think 软开关实测无效，必须走这个 API 参数。
    think: false

    # 单次回答的最大 token 数（对应 Ollama num_predict）。0 = 不限制。
    #
    # ⚠️ 2026-10-12 从 1024 提到 2048，与 application.yml 的 qa.local 默认值保持一致。
    #    **必须同步改这里**：profile 专属文件的优先级高于 application.yml，
    #    只改 application.yml 的默认值会被本文件静默盖掉 ——
    #    实测踩过：改完之后日志里"装配本地抽取模型 … maxOutputTokens=1024"，
    #    也就是说本地模式实际仍是旧值，而云端那侧已经生效，两边不一致。
    #    1024 ≈ 700 汉字，是当初配"回答控制在 200 字以内"那条提示词的；
    #    提示词改成"答完整"之后余量偏紧，截断又会发生在用户看不见的地方。
    # 注意它与系统提示词第 8 条是两道不同的闸：提示词管"该说多少"，
    # 这里管"最多能说多少"，后者是防止复读跑飞的硬兜底。
    max-output-tokens: 2048

    timeout: 120s

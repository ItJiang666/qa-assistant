# =============================================================================
# qa-assistant 主配置（所有 profile 共享）
# =============================================================================
# 分文件约定（开发文档 10.5）：
#   application.yml          公共项 —— 端口、上传限制、qa.* 业务参数
#   application-h2.yml       数据源（默认，零安装）
#   application-mysql.yml    数据源（可选）
#   application-local.yml    模型（默认，本地 Ollama）
#   （application-cloud.yml 云端模型，P4 阶段加入）
#
# profile 是两条正交的轴，用 QA_PROFILES 一起指定，默认 h2,local：
#   数据源: h2 | mysql        模型: local | cloud
# =============================================================================

server:
  port: ${SERVER_PORT:8080}
  # 优雅停机：等在途请求与入库任务收尾，避免留下半截状态
  shutdown: graceful

spring:
  application:
    name: qa-assistant

  # ===========================================================================
  # 读取项目根目录的 .env（P4 新增）
  # ===========================================================================
  # 用法：把 .env.example 复制为 .env，填上 API Key。
  #
  # 三处细节，少一个都会踩坑：
  #   1. `optional:` —— .env 不存在时**不报错**。只用本地 Ollama 的人根本不需要这个文件。
  #   2. `[.properties]` —— 告诉 Spring 按 properties 格式解析（KEY=VALUE，# 开头是注释）。
  #      不写这个后缀，Spring 会因为文件没有扩展名而猜不出格式。
  #   3. 路径是**相对工作目录**的：IDEA 默认是项目根；`java -jar` 则是你在哪个目录启动
  #      就以哪个目录为根。换目录启动要记得把 .env 一起带过去。
  #
  # ⚠️ 优先级：.env 里的值**高于** application.yml 里的默认值。
  #    所以哪天 .env 里留了个过期的 Key，它会静默生效 —— 排查"配置明明改了却没变"时，
  #    第一个该看的就是这里。
  config:
    import: optional:file:./.env[.properties]

  profiles:
    active: ${QA_PROFILES:h2,local}
  lifecycle:
    timeout-per-shutdown-phase: 30s
  servlet:
    multipart:
      # 单文件 50MB（开发文档 6.3 常量）
      max-file-size: 50MB
      # 一次可多选上传，请求体上限放宽到 200MB
      max-request-size: 200MB

mybatis:
  mapper-locations: classpath:mapper/*.xml
  configuration:
    # 下划线列名 → 驼峰属性名，省掉每个字段的 resultMap
    map-underscore-to-camel-case: true
    # 查询结果里的 NULL 也回调 setter，否则基本类型字段会保留旧值
    call-setters-on-nulls: true

qa:
  # 模型模式：local | cloud（与 Spring profile 无关，见 RunMode）
  mode: ${QA_MODE:local}

  # 运行时数据根目录（决策 19）。默认落在用户目录，
  # 这样 IDEA 启动与 java -jar 启动看到的是同一份数据。
  # 下面会自动创建 data / uploads / index 三个子目录。
  data-dir: ${QA_DATA_DIR:${user.home}/.qa-assistant}

  # 允许上传的扩展名。顺序有意义 —— 报错话术按这个顺序展示给用户。
  # doc = Word 97-2003 老式二进制，由 Tika 的 POI HWPF 模块解析；
  #       已用真实 .doc 实测通过（4 个分块、正文无乱码）。复杂排版建议改用 .docx。
  # 图片（jpg/jpeg/png/webp/bmp）与上面那些**不是一类**：它们没有文字层，
  # Tika 一个字都提不出来，上传后必然"解析失败"→ 用户再点「识别文字」走本机 OCR。
  #  改动本项时同步改下面的 qa.ocr.recognizable-extensions，否则会出现
  #    "能上传但识别按钮永远置灰"的死角。
  allowed-extensions: txt,md,docx,doc,pdf,xlsx,html,jpg,jpeg,png,webp,bmp

  # ===========================================================================
  # 云端模型（P4）
  # ===========================================================================
  #  为什么这些配置放在本文件，而不是 application-cloud.yml：
  #    profile 只占"数据源"那条轴（决策 15）；模型来源由 qa.mode + 界面上的运行时开关决定。
  #    若把云端配置放进 cloud 专属 profile 文件，那么"用默认 h2,local 启动、再在界面上
  #    切到云端"这条最常见的路径就读不到这些配置 —— 症状是配了模型名却被忽略。
  #    所以：**云端配置必须放在任何 profile 都会加载的文件里**。
  #
  # 默认组合：对话 DeepSeek + 向量阿里百炼（两者都经官方文档逐项核对，见 presets 注释）
  # ⚠️ 向量的默认厂商在 2026-10-12 从 siliconflow 改成了 dashscope，理由见下方 embedding 段注释
  #    （可达性：某些网络访问不了 api.siliconflow.cn）。云端模式因此只需要两个 Key：
  #    DEEPSEEK_API_KEY（对话）+ DASHSCOPE_API_KEY（向量）。
  cloud:
    chat:
      # 厂商预设 id，见下方 presets
      provider: deepseek
      # 留空则取预设的第一个模型；显式填了以填的为准
      #  deepseek-chat / deepseek-reasoner 已于 2026-07-24 停止服务，勿再使用
      model: deepseek-flash
      timeout: 60s
      # 云端比本地多一次重试：429 限流重试一下往往就好了
      max-retries: 2
      max-output-tokens: 2048
      # 思考模式默认值：true = 开（推荐），false = 关。
      #
      #  2026-10-10 实测把这里的默认从 false 改成了 true，依据是下面这组对照
      #    （同一份 Prompt：1342 字系统提示词 + 2066 字检索资料，正确片段排在第 3 位，各跑 3 次）：
      #      flash + 关思考 → 0/3 答对，约 1.0 s
      #      flash + 开思考 → 3/3 答对，约 2.1 s（思考约 700 字）
      #      v4-pro + 关思考 → 3/3 答对，约 1.0 s
      #      v4-pro + 开思考 → 3/3 答对，约 11.8 s
      #    失败样本不是"没看到"，而是"看到了却不敢用"：模型把答案抄了出来，
      #    又因为"资料没给文件名、无法标注来源"判定自己无法作答。
      #    也就是说关思考削弱的是**在多条铁律之间做取舍**的能力。
      #    "答错"与"慢 1 秒"不是同一量级的代价，所以默认取正确率。
      #
      # 运行时可切（「系统状态」页），重启后回到这个值；
      # "怎么关"各厂商参数名不同，由预设的 thinking-off-params 描述，不写死在代码里。
      thinking: true
      # 抽取模型走 response_format: json_object（协议标准能力）。
      # 个别厂商不支持会返回 400，那时把它设为 false。
      json-mode: true
      # 额外透传参数（用户显式配置优先于预设），例如调 reasoning-effort：
      # custom-parameters:
      #   reasoning_effort: none
    embedding:
      #  2026-10-12 从 siliconflow 换成 dashscope。理由如下，别轻易改回去。
      #
      # 换的理由（另一台机器上的实测反馈）：api.siliconflow.cn 的 **TLS 握手被中间网络掐断**
      # （SSLHandshakeException: The remote host closed the handshake），而 api.deepseek.com 正常。
      # 症状是"能聊天，但一上传文件就失败"—— 因为解析→分块之后必须调 embedding 做向量化，
      # 那一步不通，整条入库就失败。这类网络限制在校园网/公司内网/部分云主机上很常见，
      # 用户自己改不了，所以默认值应该选可达性更稳的那家：阿里云百炼。
      #
      #  代价必须知道：维度从 2560 变成 1024（text-embedding-v4 实测维度），
      #    与本地 qa-embed:4b（2560）**不再是同源同维**，
      #    因此「本地 ↔ 云端」互切时**必须重建索引**
      #    （不重建会明确报"向量索引与当前向量模型不匹配"，不会静默出错）。
      # 想要"免重建"的 2560 维方案，仍可换回 siliconflow（+ SILICONFLOW_API_KEY），
      # 前提是那台机器能访问 api.siliconflow.cn。
      provider: dashscope
      model: text-embedding-v4
      #  实测值，不是厂商默认值（官方文档未标注各模型默认维度，我们实测定为 1024）：
      #    不传 dimensions 时返回 1024；显式写出来是为了防止上游悄悄改默认值。
      #   换 embedding 模型时必须同步改这一行。
      dimension: 1024
      # 云端向量接口单次提交条数。
      #  实测：配 16 时入库直接 400 —— 百炼 text-embedding-v4 单次最多 10 条：
      #    InvalidParameter: batch size is invalid, it should not be larger than 10.
      # 各厂商上限写在预设的 embedding-max-batch 里，实际取"配置值与上限的较小者"，
      # 所以这里可以按需调大（换到上限更高的厂商时），不会越界。
      batch-size: 10
      timeout: 60s
      max-retries: 2

    # 厂商预设：只描述"官方端点长什么样、Key 放哪个环境变量、怎么关思考"。
    # 规则：配置里填了就以填的为准，留空用预设 —— 这条规则只在 CloudEndpointResolver 实现一次。
    # 值均来自官方文档逐项核对（2026-10-09），不凭记忆填写。
    presets:
      deepseek:
        label: DeepSeek（深度求索）
        api-key-env: DEEPSEEK_API_KEY
        # 官方《首次调用 API》给的是 https://api.deepseek.com；官方集成页另用 /v1/chat/completions。
        # 这里用带 /v1 的写法（OpenAI 客户端会自动补 /chat/completions）。
        # 若遇 404，把结尾的 /v1 去掉再试 —— 这一点官方没有明确"两者等价"的表述。
        base-url: https://api.deepseek.com/v1
        chat-models:
          - deepseek-flash
          - deepseek-v4-pro
        # 官方全站（sitemap 52 个页面）无 embeddings 端点 ⇒ 云端向量必须另配一家
        embedding-models: []
        thinking-off-params:
          thinking:
            type: disabled
        notes: 无 embedding 接口；限流按并发连接数（flash 2500 / v4-pro 500）；402 = 余额不足（重试无用）；响应可能持续返回空行或 SSE 的 keep-alive 注释行

      dashscope:
        label: 阿里云百炼（DashScope 兼容模式）
        api-key-env: DASHSCOPE_API_KEY
        # 官方推荐改用业务空间专属域名：https://{WorkspaceId}.cn-beijing.maas.aliyuncs.com/compatible-mode/v1
        # 旧域名仍可正常使用（官方原话），且不需要填 WorkspaceId，故作为默认值。
        base-url: https://dashscope.aliyuncs.com/compatible-mode/v1
        chat-models:
          - qwen3.7-plus
          - qwen3.8-flash
          - qwen3.8-max
        embedding-models:
          - text-embedding-v4
          - text-embedding-v3
        embedding-dimensions:
          text-embedding-v4: 1024
          text-embedding-v3: 1024
        # 实测上限：text-embedding-v4 单次最多 10 条，超了报
        #   "batch size is invalid, it should not be larger than 10."
        embedding-max-batch: 10
        notes: API Key 与地域绑定，跨地域调用报 401（不是 Key 失效）；messages 仅第 0 条可为 system 且最后一条必须是 user；限流按主账号合并计算

      siliconflow:
        label: 硅基流动 SiliconFlow
        api-key-env: SILICONFLOW_API_KEY
        base-url: https://api.siliconflow.cn/v1
        chat-models:
          - deepseek-ai/DeepSeek-V4-Flash
          - Pro/deepseek-ai/DeepSeek-R1
        embedding-models:
          - Qwen/Qwen3-Embedding-4B
          - Qwen/Qwen3-Embedding-8B
          - BAAI/bge-m3
        # ⚠️ 这个 2560 不是厂商默认值，而是**我们必须显式指定**的值：
        #    官方 API 文档没有标注各 embedding 模型的默认维度（只给了最大输入 token），
        #    dimensions 参数仅 Qwen/Qwen3 系列支持（4B 可选 64~2560，8B 可选 64~4096）。
        #    写它的理由是：本地 qa-embed:4b 就是 Qwen3-Embedding-4B（2560 维），
        #    要求云端同样输出 2560 维，两边才可能落在同一向量空间、切换免重建索引。
        #    "可能"二字是刻意的 —— 是否真的同源同维必须实测比对向量，不能只信文档。
        embedding-dimensions:
          Qwen/Qwen3-Embedding-4B: 2560
          Qwen/Qwen3-Embedding-8B: 4096
        thinking-off-params:
          enable_thinking: false
        notes: 官方未标注部分 embedding 模型的默认维度，务必显式配 dimension；Qwen3 系列支持 dimensions 参数；另有 thinking_budget / reasoning_effort / min_p 等扩展参数

      # ── 以下 7 家为 v1.11 P4 收尾补齐：事实取自官方文档核对（2026-10-10），非凭记忆 ──
      # 每条都标注了 **能否作向量源** —— 这是最容易配错的点：
      # 方舟的 embedding 明确不支持 OpenAI 协议，Kimi/MiniMax/阶跃根本没有 embedding 接口。

      zhipu:
        label: 智谱 BigModel（GLM）
        api-key-env: ZHIPU_API_KEY
        # ⚠️ 不是 /v1：智谱用的是 /api/paas/v4（写错必 404）
        base-url: https://open.bigmodel.cn/api/paas/v4
        chat-models:
          - glm-5.3
          - glm-5.3-flash
          - glm-5.2
        embedding-models:
          - embedding-3
          - embedding-2
        embedding-dimensions:
          embedding-3: 2048
          embedding-2: 1024
        # embedding-3 单次最多 64 条
        embedding-max-batch: 64
        thinking-off-params:
          thinking:
            type: disabled
        notes: 可作向量源。base-url 不是 /v1；temperature 区间是 (0,1)，官方明确"不建议取值为 0"——抽取模型（温度 0）在这里可能不生效，必要时用 custom-parameters 覆盖；embedding-3 可用 dimensions 指定 256/512/1024/2048

      kimi:
        label: 月之暗面 Kimi（Moonshot）
        api-key-env: MOONSHOT_API_KEY
        base-url: https://api.moonshot.cn/v1
        chat-models:
          - kimi-k3
          - kimi-k2.7-code
          - kimi-k2.6
        # ⚠️ 只能当对话源：官方端点一览里没有 /v1/embeddings
        embedding-models: []
        notes: 不能作向量源（无 embedding 接口）。moonshot-v1-* 全系列已于 2026-08-31 下线、kimi-k2 系列已于 2026-05-25 下线，勿再用；max_tokens 已弃用改为 max_completion_tokens（本客户端仍发 max_tokens，若报错请用 custom-parameters 调整）

      ark:
        label: 火山方舟（豆包）
        api-key-env: ARK_API_KEY
        base-url: https://ark.cn-beijing.volces.com/api/v3
        chat-models:
          - doubao-seed-2-1-pro-260915
          - doubao-seed-2-1-lite-260915
        # ⚠️ 官方原文："向量化能力：模型不支持 OpenAI API，请使用方舟 SDK"
        embedding-models: []
        thinking-off-params:
          thinking:
            type: disabled
        notes: 不能作向量源（embedding 不走 OpenAI 协议，必须用方舟 SDK 打 /api/v3/embeddings/multimodal）。用 API Key 鉴权时 model 填 Model ID 即可，**不强制**接入点 ID（只有 AK/SK 鉴权或多应用隔离场景才用 ep-xxx）

      hunyuan:
        label: 腾讯混元
        api-key-env: HUNYUAN_API_KEY
        base-url: https://api.hunyuan.cloud.tencent.com/v1
        chat-models:
          - hunyuan-turbos-latest
          - hunyuan-lite
        embedding-models:
          - hunyuan-embedding
        embedding-dimensions:
          hunyuan-embedding: 1024
        notes: 可作向量源，但限制最多：embedding 只接受 input 与 model 两个参数、维度固定 1024（**不要传 dimensions**，否则可能 400）；stop 语义与 OpenAI **相反**（混元停在匹配内容之后）；官方公告将迁移至 TokenHub，长期可用性待观察

      minimax:
        label: MiniMax
        api-key-env: MINIMAX_API_KEY
        base-url: https://api.minimax.cn/v1
        chat-models:
          - MiniMax-M3
          - MiniMax-M2.7
        embedding-models: []
        notes: 不能作向量源（无 embedding 接口）。差异较多：presence_penalty / frequency_penalty / logit_bias 会被忽略；n 只能为 1；temperature 超出 [0,2] 直接报错；响应体含 base_resp / input_sensitive 等自有字段

      stepfun:
        label: 阶跃星辰 StepFun
        api-key-env: STEP_API_KEY
        base-url: https://api.stepfun.com/v1
        chat-models:
          - step-5-preview
          - step-3.7-flash
        embedding-models: []
        notes: 不能作向量源（无 embedding 接口）。默认 temperature=0.5 / top_p=0.9；同时返回 reasoning 与 reasoning_content

      qianfan:
        label: 百度千帆 v2
        api-key-env: QIANFAN_API_KEY
        base-url: https://qianfan.baidubce.com/v2
        chat-models:
          - ernie-5.1
          - ernie-4.5-turbo-128k
        embedding-models:
          - qwen3-embedding-4b
          - bge-large-zh
          - tao-8k
        embedding-dimensions:
          qwen3-embedding-4b: 2560
          bge-large-zh: 1024
          tao-8k: 1024
        notes: 可作向量源。鉴权是 **Bearer（bce-v3/ALTAK-...）而不是 AK/SK 签名**（AK/SK 属旧版、官方 SDK 已标注过时）；embedding 维度由模型固定、**不支持 dimensions 参数**；响应含千帆自有字段

  ingest:
    chunk-size: 500
    chunk-overlap: 50      # 建议为 chunk-size 的 10%

  # ── 本地离线 OCR（扫描版 PDF / 图片识别）───────────────────────────────
  # ⚠️ 这是**可选增强**，不是必需依赖：不装 Python 也能跑全部主流程，
  #    只是"扫描件入库"这一项不可用，界面上会给出安装指引。
  #
  # 为什么值得做：扫描件（无文字层）原本只能得到一句"需要 OCR"，而这类文件
  # 往往正是最敏感的材料（合同、档案）。所以在**本机**做 OCR，数据不出内网 ——
  # 这是本项目选 RapidOCR（模型随 pip 包下发、不联网下载）而非任何云端 OCR 的原因。
  #
  # 为什么图片也算：.jpg/.png 这类文件同样没有文字层，而且**永远**不会有 ——
  # 与扫描版 PDF 完全同类。实测同一张图直接识别 165 字 / 置信度 0.9769，
  # 比"把图塞进 PDF 再识别"（224 字 / 0.9749，多出一次重复的插图识别）还干净。
  ocr:
    # 是否允许尝试。关掉后界面直接置灰，不再探测。
    enabled: true

    # 哪些扩展名值得走 OCR。⚠️ 必须与上面的 allowed-extensions 保持一致：
    #   * 本项多出某个格式 → 上传那步仍被挡，等于白配；
    #   * allowed-extensions 多出某个格式而本项没有 → 文件能上传、解析必然失败、
    #     识别按钮却永远置灰，用户会以为系统坏了。
    # 不放进本项的理由：docx/doc/txt/md/xlsx/html 本来就带文字层，
    # 对它们做 OCR = 把清晰的原文换成带错字的猜测，是帮倒忙。
    recognizable-extensions: pdf,jpg,jpeg,png,webp,bmp

    # 上传后是否自动跑一次 OCR，省掉"手动点识别文字"这一步。默认开启。
    # ⚠️ 触发条件很窄：只在【解析不出文字】且【扩展名在可识别清单里】时才跑，
    #    也就是只对扫描件和图片生效 —— 正常 docx/txt 的入库路径一个字都没变。
    # 为什么默认开：不自动识别的话，用户传一张图只会看到"失败"，
    #    还得自己意识到"这里有个按钮可以点"，对不熟悉系统的人是个坎。
    # 关掉它 = 回到旧行为（上传后显示失败原因，用户自己点「识别文字」）。
    auto-recognize: true

    # 自动识别完成后是否跳过人工确认、直接入库。默认关闭，且**不建议**打开。
    # 理由：OCR 一定会有错字，而错字一旦入库就会被检索、被引用、被模型当成依据。
    # 实测同一批清晰印刷体里既有全对的（EQ-2043-A7、SN-88231），
    # 也有被读坏的（! d p、全角 ２００），而用户无法从界面分辨哪份是哪份。
    # 所以自动化的边界划在"把字提出来"，不含"决定它能不能进知识库"。
    auto-confirm: false

    # Python 解释器。留空则自动探测（先 python3、再 python）。
    # 之所以要能显式指定：Windows 上常有多套 Python（venv/conda/Store 版），
    # 自动探测可能挑中一个没装依赖的。
    python:

    # OCR 脚本路径。留空用 deploy/ocr/qa_ocr.py（相对**工作目录**解析，与 .env 同一套约定）。
    script:

    # 单页实测约 2.4 s（A4@200DPI）→ 50 页约 2 分钟，这是"用户愿意等"的上限。
    # 更重要的是必须在**应用层**挡：若让 Python 因页数过多被 OOM 杀掉，
    # Java 只能看到一个退出码，给不出"请减少页数"这种可照做的提示。
    max-pages: 50

    # 拆页渲染精度。200 是实测平衡点：再低小字号会糊，再高只是线性变慢
    # （300 DPI 的像素量是 200 的 2.25 倍）。
    dpi: 200

    # 低于此置信度的行直接丢弃。**错的内容比没有更危险**：一旦入库，
    # 它会被检索、被引用、被模型当成依据。
    min-confidence: 0.5

    # 单次识别超时。超时会连**进程树**一起杀，避免孤儿 Python 继续吃 CPU。
    timeout: 3m

  retrieval:
    # 检索条数。
    #
    # ⚠️ 2026-10-12 从 4 提到 10。原因是用户反馈"回答不完整"，实测定位到
    #    **单次检索只给模型 900~1900 字资料**，而知识库里的内容远不止这些 ——
    #    同一批问题在不同 topK 下能取回的量（minScore=0 实测）：
    #      topK=4  →  906 / 1714 / 1859 / 1807 / 1526 字
    #      topK=10 → 3225 / 3580 / 4033 / 4511 / 3359 字
    #      topK=20 → 6881 ~ 7410 字
    #    也就是说：不是"模型不肯说"，而是**资料根本没被取出来**。
    #
    # 为什么之前是 4：第一轮评测量"答案块在不在前 k 名"（4→79%、6→86%、8→93%），
    #    第二轮量"最终答没答对"，发现 topK=8 与 4 的答对率一样（8/8），
    #    而 8 每次无条件塞满、多出的片段被当成"拿无关内容补全回答"的诱因。
    #    但那个结论针对的是**幻觉**；这次的诉求是**完整性**，两者取舍不同：
    #    宁可多给几块让回答有据可依，也不能让答案因为资料没取全而缺一半。
    #    10 × 500 字 ≈ 5000 字 ≈ 7.5k token，仍在 4.6.6 的 8k 提示词预算内。
    # 上限受 2.2 约束（单次问答检索 topK ≤ 10）—— 已经是允许的最大值。
    top-k: 10

    # 相似度阈值。
    #
    # ⚠️ 2026-10-11 从 0.75 降到 0.65。原因：0.75 是在**大文档**上调出来的，
    #    对三份 206/8/4 块的文档完全正确，但它会**误杀短文档**。
    #    决定性对照（同内容、同块大小，只差"有没有文字层"）：
    #      扫描件（3 页无文字层，走 OCR）  6 问平均 0.7010，过 0.75 的 0/6
    #      同一内容的有文字层 PDF         6 问平均 0.7220，过 0.75 的 1/6
    #    → 这跟 OCR 准不准、跟是不是图片都无关，是"短文本对短查询"本身分低。
    #    实测分数与库的规模强相关：
    #      206 块 / 每块 500~1000 字  →  0.80 ~ 0.85
    #      1~3 块 / 每块 400~500 字   →  0.67 ~ 0.78
    #    症状是"入库成功却永远检索不到"，而界面上完全看不出原因。
    #
    # 为什么是 0.65 而不是 0.70：0.70 救不回上面那批（0.67~0.74 多数仍被挡）；
    # 0.65 能救回，且探针验证没有引入编造 —— 域外与"话题相关但无答案"共 11 问，
    # 在 0.65 下仍全部如实回答"现有资料中未找到相关信息"。
    #
    # 分数分布（本地 qwen3.5:9b，大文档）：
    #   完全无关的话题（红烧肉 / 天气 / 明朝皇帝）：0.63 ~ 0.73
    #   话题相关但**不含答案**（问参数量、问 PostgreSQL 迁移）：0.81 ~ 0.89
    #   真正含答案：0.83 ~ 0.89
    # ⚠️ 后两档**互相重叠**，所以任何阈值都**切不掉"相关但没答案"的片段**，
    #    它只能清掉完全无关的那一批。别再指望靠调它解决幻觉 —— 实测无效。
    # 要动请先用 /api/v1/documents/search 量一遍自己文档的分数分布。
    min-score: 0.65

    # 查询改写（Query Expansion）：把用户的问法改写成"文档可能使用的说法"，多路检索后合并。
    #
    # ⚠️ 默认**关闭**，这是评测测出来的结论，不是保守：
    #   在 15 个探针（14 正例 + 1 负例）上开/关对照，命中率完全一样（13/14），
    #   而检索耗时从 395ms 涨到 1186ms（约 3 倍），另外每次多一次模型调用。
    #   进一步查下去才发现：唯一那条漏检**根本不是检索问题** ——
    #   要检索的内容（"空资料占位符"）在知识库那份 docx 里出现 0 次，
    #   而在现行的 md 源文件里出现 6 次，即**库里那份文档是旧版本**。
    #   换句话说：对库里确实存在的内容，topK=8 的单路检索已经是 13/13。
    #   改写救不了"库里没有的内容"，所以在这个知识库上它只是纯开销。
    #
    # 那为什么还留着？因为它的适用场景是真实存在的：文档用词与用户口语差距大、
    # 或知识库换成另一批文档时，它可能立刻见效。开启只需把 enabled 改成 true，
    # 并用 /api/v1/documents/search 传 expand=true 先量一遍增益再决定。
    query-expansion:
      enabled: false
      # 额外生成几条改写式（不含原问题）：加上原问题共 3 路检索
      extra-queries: 2

  memory:
    inject-max-count: 8    # L3 每轮最多注入几条
    inject-max-chars: 800  # L3 每轮最多注入多少字
    max-per-user: 200      # 单用户记忆上限，超出按重要度淘汰
    min-confidence: 0.6    # 抽取置信度阈值，低于此值丢弃
    extract-enabled: true  # 长期记忆总开关（关闭后只剩 L2 会话记忆）
    window-max-tokens: 3000          # L2 历史 token 预算
    window-fallback-messages: 20     # L2 兜底：按条数裁剪时的条数

logging:
  level:
    root: INFO
    com.itjiang.qa: INFO
